<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>喜らく 速報BI（Beds24）</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="page-shell">
    <header class="hero-header" id="hero-header">
      <div>
        <h1>喜らく 速報BI</h1>
        <div class="subtitle">Beds24速報 / Cash BEP / 予約ペース / MC後GOP</div>
        <div class="meta-line" id="header-meta">読み込み中…</div>
      </div>
      <div class="header-right" id="header-right"></div>
    </header>

    <main class="dashboard" id="dashboard">
      <section id="daily-summary-section"></section>

      <section class="command-center" id="command-center" aria-label="今日見る数字"></section>

      <section class="room-type-section" aria-label="部屋タイプ別KPI">
        <div id="room-type-occupancy-chart"></div>
        <div id="room-type-revenue-mix"></div>
      </section>

      <section class="pace-summary" id="pace-summary" aria-label="ペースコメント"></section>

      <section class="status-row" id="status-row" aria-label="ステータス"></section>

      <section id="notes-section" aria-label="注記"></section>

      <section aria-label="詳細">
        <div class="section-title">詳細</div>
        <div class="details-grid" id="details-grid"></div>
      </section>
    </main>
  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>
