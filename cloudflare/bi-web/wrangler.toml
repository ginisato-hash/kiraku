name = "kiraku-bi"
main = "src/worker.js"
compatibility_date = "2026-07-08"

# HTML/JS/CSS は Static Assets から配信（BIデータは同梱しない）
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"

# BIデータ（JSON/CSV）は R2 から読む。binding名・bucket名は固定。
[[r2_buckets]]
binding = "BI_DATA"
bucket_name = "kiraku-bi-data"

# 15分毎に refresh-bi-r2.yml の workflow_dispatch を叩くだけ（scheduled()参照）。
# GitHub Actionsの on.schedule cron は同じ 3,18,33,48 分刻みで、ここでの
# 二重発火はrefresh-bi-r2.yml側のconcurrency group（cancel-in-progress: false）
# が直列化するため安全。GITHUB_ACTIONS_DISPATCH_TOKEN secretが必要
# （`wrangler secret put GITHUB_ACTIONS_DISPATCH_TOKEN`、リポジトリには置かない）。
[triggers]
crons = ["3,18,33,48 * * * *"]
