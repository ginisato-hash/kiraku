<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>宿泊者名簿 / GUEST REGISTRATION FORM — 喜らく</title>
  <style>
    /* 印刷CSSは既存Beds24版帳票をsource of truthとして固定。数値・寸法は
       勝手に調整しないこと（用紙内寸・余白・ロゴ幅・フォントサイズ等は
       guestRegisterTemplate.js側のインラインstyleと合わせて1セット）。 */
    @page {
      size: A4 portrait;
      margin: 10mm 12mm;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: #fff;
    }

    .guest-register-sheet {
      width: 186mm;
      height: 267mm;
      margin: 5mm auto 0 auto;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: #ffffff;
      color: #222222;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        Meiryo,
        Arial,
        sans-serif;
      font-size: 11.5px;
      line-height: 1.35;
      break-inside: avoid;
      page-break-inside: avoid;
    }

    @media print {
      .guest-register-sheet {
        break-after: page;
        page-break-after: always;
      }

      .guest-register-sheet:last-child {
        break-after: auto;
        page-break-after: auto;
      }

      .no-print {
        display: none !important;
      }
    }

    /* ここから下は帳票そのものではなく、画面上でのみ見える「戻る」リンクの
       体裁（印刷時は上の @media print で非表示）。帳票デザインとは無関係。 */
    .no-print {
      margin: 4mm 0;
      text-align: center;
    }

    .no-print a {
      color: #2f6fed;
      font-size: 13px;
      font-family: -apple-system, "Hiragino Sans", sans-serif;
    }
  </style>
</head>
<body>
  <div class="no-print">
    <a href="/">← 戻る / Back</a>
  </div>
  <div id="grf-root">
    <p class="no-print">読み込み中…</p>
  </div>

  <script type="module" src="./print-guest-register.js"></script>
</body>
</html>
