<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>清掃・客室指示表 — 喜らく</title>
  <style>
    /* FINAL DESIGN — 確定仕様。白黒/最小限のスタイルのみ(角丸・影・カード風UI・
       ヘッダー以外の色は使わない)。ロゴ不要。 */
    @page {
      size: A4 portrait;
      margin: 7mm;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      background: #ffffff;
    }

    body {
      color: #111111;
      font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", system-ui, sans-serif;
    }

    table {
      border-collapse: collapse;
      table-layout: fixed;
    }

    th, td {
      border: 1px solid #777777;
      box-sizing: border-box;
    }

    @media print {
      .no-print { display: none !important; }
    }

    .cleaning-sheet {
      width: 196mm;
      height: 283mm;
      margin: 0 auto;
      box-sizing: border-box;
    }

    .cs-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      height: 13mm;
      margin-bottom: 2mm;
    }

    .cs-header-date { font-size: 5.3mm; font-weight: 700; }
    .cs-header-title { font-size: 5.3mm; font-weight: 700; }
    .cs-header-property { font-size: 4.2mm; font-weight: 700; }

    .cs-unassigned-warning {
      font-size: 3.2mm;
      color: #111111;
      margin: 0 0 2mm 0;
    }

    .cs-main-table {
      width: 196mm;
    }

    .cs-main-table thead tr { height: 7.5mm; }

    .cs-main-table th {
      background: #f3f3f3;
      font-size: 2.9mm;
      font-weight: 700;
      padding: 0.8mm;
      text-align: center;
      vertical-align: middle;
      white-space: nowrap;
    }

    /* RoomNoヘッダは大きくしなくてよい(仕様上の指定)。見切れないことを優先し、
       他より文字が長い(6文字)ため個別に小さくする。 */
    .cs-h-room {
      font-size: 2.6mm;
    }

    .cs-main-table tbody tr { height: 10.5mm; }

    /* 4F(401-406)/5F(501-507)/6F(601-607)の階境界。501/601の行の上辺だけ
       通常罫線(1px)より明確に太くする。背景色は使わず罫線のみで区切る。 */
    tr.cs-floor-start > td {
      border-top: 0.7mm solid #111111;
    }

    .cs-main-table td {
      font-size: 3.4mm;
      font-weight: 700;
      padding: 1mm 1.2mm;
      vertical-align: middle;
      overflow: hidden;
    }

    /* RoomNo: 清掃スタッフが最初に見る情報。枠内で上下に収まる最大付近まで
       大型化する(約22-23px相当)。 */
    .cs-c-room {
      font-weight: 800;
      font-size: 6mm;
      line-height: 1;
      padding-left: 0.5mm;
      padding-right: 0.5mm;
      text-align: center;
    }

    .cs-c-guest, .cs-c-notes { text-align: left; }

    .cs-c-count, .cs-c-nights, .cs-c-status, .cs-c-arrival, .cs-c-ota, .cs-c-onsite {
      text-align: center;
    }

    /* お客様名：既定13px相当(3.4mm、tdの基本値をそのまま使用)/700。長い氏名は
       guestNameSizeClass()がcs-guest-12/11を付与し段階的に縮小する。折返しで
       行高が崩れないようnowrap+省略(はみ出し部分は既存のtd overflow:hiddenで
       非表示)。 */
    .cs-c-guest {
      white-space: nowrap;
    }
    .cs-guest-12 { font-size: 3.2mm; }
    .cs-guest-11 { font-size: 2.9mm; }

    /* 人数：上段=総人数(最大サイズ)、下段=大人/子供内訳。 */
    .cs-total-guests {
      font-size: 5.5mm;
      font-weight: 800;
      line-height: 1;
    }
    .cs-guest-breakdown {
      font-size: 2.8mm;
      font-weight: 700;
      line-height: 1.05;
      white-space: nowrap;
    }

    .cs-c-nights {
      font-size: 5mm;
      font-weight: 800;
      line-height: 1;
    }

    .cs-c-status {
      font-size: 4.5mm;
      font-weight: 800;
    }

    .cs-c-ota {
      font-size: 3.2mm;
      font-weight: 600;
    }

    /* 現地決済：見落とし防止のため太字。対象外は空セルのまま。line-height:1を
       明示しないとブラウザ既定行高(約1.2倍)で他セルより行高が膨らんでしまう
       (人数の2段組セル等と揃えるため必須)。 */
    .cs-onsite-label {
      font-size: 2.8mm;
      font-weight: 800;
      line-height: 1;
    }
    .cs-onsite-amount {
      font-size: 3.5mm;
      font-weight: 800;
      line-height: 1;
    }

    /* 備考・通信セル：外枠(表全体の罫線)のみを残した無地の記入欄。かつて2行clamp用に
       display:-webkit-box をtd自体に指定していたが、これは<td>に必須の
       display:table-cellを上書きしてしまい、セルが行の高さいっぱいに広がらず
       内側に余計な罫線があるように見える不具合の原因だった。tdへは何のdisplayも
       指定せず、内部に「客:」「指:」それぞれ1行(nowrap+ellipsis)のdivを最大2つ
       置くだけにする — td自体は通常のtable-cellのまま、外枠だけの記入欄を維持する。 */
    .cs-c-notes {
      overflow: hidden;
    }
    .cs-notice-line, .cs-instruction-line {
      font-size: 3.2mm;
      font-weight: 600;
      line-height: 1.25;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .cs-footer-box {
      border: 1px solid #777777;
      height: 50mm;
      margin-top: 2mm;
      padding: 2mm;
      box-sizing: border-box;
    }

    .cs-footer-title {
      font-size: 3.6mm;
      font-weight: 700;
      margin-bottom: 1mm;
    }

    .no-print a {
      color: #2f6fed;
      font-size: 3.4mm;
    }
  </style>
</head>
<body>
  <div class="no-print">
    <a href="/">← 戻る / Back</a>
  </div>

  <div id="cs-print-content">
    <p class="no-print" id="cs-loading-label">読み込み中…</p>
  </div>

  <script type="module" src="./print-cleaning.js"></script>
</body>
</html>
