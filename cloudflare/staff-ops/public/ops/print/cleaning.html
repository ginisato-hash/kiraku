<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>清掃・客室指示表 — 喜らく</title>
  <style>
    /* FINAL DESIGN — 確定仕様。白黒/最小限のスタイルのみ(角丸・影・カード風UI・
       ヘッダー以外の色は使わない)。ロゴ不要。 */
    @page {
      size: A4 portrait;
      margin: 7mm;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      background: #ffffff;
    }

    body {
      color: #111111;
      font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", system-ui, sans-serif;
    }

    table {
      border-collapse: collapse;
      table-layout: fixed;
    }

    th, td {
      border: 1px solid #777777;
      box-sizing: border-box;
    }

    @media print {
      .no-print { display: none !important; }
    }

    /* 用紙1枚ぶんの外枠。高さは283mm -> 281mm(2mm削減、2026-09-03)。
       @page margin 7mm を引いたA4の使用可能高さがちょうど283mmで、この外枠は
       内容量に関係なく固定高さで用紙下端に接していた(実ブラウザ計測:
       contentBottom 1070px == usable 1070px)。印刷エンジン/プリンタ側の丸め差が
       1pxでも出ると2ページ目・下端切れになり得るため、下端に物理的な安全余白を
       確保する。281mmでも内容(footer下端は268.5mm)には一切干渉しない。
       ※ 表・行高・列幅・header・RoomNo/人数/泊数のサイズは変更していない。 */
    .cleaning-sheet {
      width: 196mm;
      height: 281mm;
      margin: 0 auto;
      box-sizing: border-box;
    }

    .cs-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      height: 13mm;
      margin-bottom: 2mm;
    }

    .cs-header-date { font-size: 5.3mm; font-weight: 700; }
    .cs-header-title { font-size: 5.3mm; font-weight: 700; }
    .cs-header-property { font-size: 4.2mm; font-weight: 700; }

    .cs-unassigned-warning {
      font-size: 3.2mm;
      color: #111111;
      margin: 0 0 2mm 0;
    }

    .cs-main-table {
      width: 196mm;
    }

    .cs-main-table thead tr { height: 7.5mm; }

    .cs-main-table th {
      background: #f3f3f3;
      font-size: 2.9mm;
      font-weight: 700;
      padding: 0.8mm;
      text-align: center;
      vertical-align: middle;
      white-space: nowrap;
    }

    /* RoomNoヘッダは大きくしなくてよい(仕様上の指定)。見切れないことを優先し、
       他より文字が長い(6文字)ため個別に小さくする。
       th.cs-h-room(specificity 0,1,1)で.cs-main-table th(同じく0,1,1)と揃え、
       ソース順で後勝ちさせる — 単なる.cs-h-room(0,1,0)だと基本ルールに負けて
       font-sizeが一切反映されない実害があった(2026-09発覚)。 */
    th.cs-h-room {
      font-size: 2.6mm;
    }

    .cs-main-table tbody tr { height: 10.5mm; }

    /* 4F(401-406)/5F(501-507)/6F(601-607)の階境界。501/601の行の上辺だけ
       通常罫線(1px)より明確に太くする。背景色は使わず罫線のみで区切る。 */
    tr.cs-floor-start > td {
      border-top: 0.7mm solid #111111;
    }

    .cs-main-table td {
      font-size: 3.4mm;
      font-weight: 700;
      padding: 1mm 1.2mm;
      vertical-align: middle;
      overflow: hidden;
    }

    /* RoomNo/人数総人数/泊数: 現場から「枠ギリギリまで」の再指摘を受け、この3項目
       だけ共通tdのpadding(1mm 1.2mm)を上書きして実際に使える面積を最大化する。
       tdへの直接display指定は禁止(display:table-cellを壊して行高が崩れる既知の
       不具合 — cs-c-notesの過去の修正参照)なので、中央寄せはvertical-align:middle
       +line-heightの調整のみで行う。
       td.cs-c-XXX(specificity 0,1,1)で.cs-main-table td(同じく0,1,1)と揃え、
       ソース順で後勝ちさせる — 単なる.cs-c-XXX(0,1,0)だと基本ルールのpadding/
       font-sizeに一切勝てず、指定した拡大が完全に無効化されていた
       (2026-09、実ブラウザのgetComputedStyleで発覚。CSS文字列の存在チェックだけの
       regression testはこの不具合を検出できなかった)。 */
    td.cs-c-room, td.cs-c-count, td.cs-c-nights {
      padding: 0.1mm 0.2mm;
    }

    /* RoomNo: 清掃スタッフが最初に見る情報。16mm×10.5mmセル内で上下・左右に
       切れない最大サイズ。401/607等の3桁がすべて完全表示されること。 */
    td.cs-c-room {
      font-weight: 800;
      font-size: 6.6mm;
      line-height: 0.95;
      text-align: center;
    }

    .cs-c-guest, .cs-c-notes { text-align: left; }

    .cs-c-count, .cs-c-nights, .cs-c-status, .cs-c-arrival, .cs-c-ota, .cs-c-onsite {
      text-align: center;
    }

    /* お客様名：既定13px相当(3.4mm、tdの基本値をそのまま使用)/700。長い氏名は
       guestNameSizeClass()がcs-guest-12/11を付与し段階的に縮小する。折返しで
       行高が崩れないようnowrap+省略(はみ出し部分は既存のtd overflow:hiddenで
       非表示)。 */
    .cs-c-guest {
      white-space: nowrap;
    }
    td.cs-guest-12 { font-size: 3.2mm; }
    td.cs-guest-11 { font-size: 2.9mm; }

    /* 到着：明示値"15:00"は既定サイズ。Booking.com commentsからの時間帯fallback
       "17:00-18:00"(11文字)は14mm列に既定3.4mmでは入らないため、この列だけ
       段階的に縮小して1行で収める(要件14。折返し3行表示は禁止)。
       td.cs-XXX(0,1,1)で .cs-main-table td(0,1,1)と同specificityにし、
       ソース順で後勝ちさせる(過去のfont-size無効化バグと同じ対策)。 */
    .cs-c-arrival { white-space: nowrap; }
    td.cs-arrival-9 { font-size: 2.7mm; padding: 0.2mm 0.3mm; }
    td.cs-arrival-range {
      font-size: 1.95mm;
      padding: 0.1mm 0.1mm;
      letter-spacing: -0.04em;
    }

    /* 人数：上段=総人数(この帳票内で最大級の文字)、下段=大人/子供内訳(従属・
       コンパクトでよい)。cs-guest-count-wrapはtd自体ではなく内側のdivなので、
       display:flexを使ってもtdのdisplay:table-cellは壊れない。 */
    .cs-guest-count-wrap {
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0;
    }
    .cs-total-guests {
      font-size: 7.5mm;
      font-weight: 800;
      line-height: 0.78;
      margin: 0;
      padding: 0;
    }
    .cs-guest-breakdown {
      font-size: 2.5mm;
      font-weight: 700;
      line-height: 1;
      margin: 0;
      padding: 0;
      white-space: nowrap;
    }

    /* 泊数: 14mm幅のセルを活かし、RoomNoに準ずる大きさまで拡大。 */
    td.cs-c-nights {
      font-size: 6.1mm;
      font-weight: 800;
      line-height: 0.95;
      text-align: center;
      white-space: nowrap;
    }

    td.cs-c-status {
      font-size: 4.5mm;
      font-weight: 800;
    }

    td.cs-c-ota {
      font-size: 3.2mm;
      font-weight: 600;
    }

    /* 現地決済：見落とし防止のため太字。対象外は空セルのまま。line-height:1を
       明示しないとブラウザ既定行高(約1.2倍)で他セルより行高が膨らんでしまう
       (人数の2段組セル等と揃えるため必須)。 */
    .cs-onsite-label {
      font-size: 2.8mm;
      font-weight: 800;
      line-height: 1;
    }
    .cs-onsite-amount {
      font-size: 3.5mm;
      font-weight: 800;
      line-height: 1;
    }

    /* 備考・通信セル：外枠(表全体の罫線)のみを残した無地の記入欄。かつて2行clamp用に
       display:-webkit-box をtd自体に指定していたが、これは<td>に必須の
       display:table-cellを上書きしてしまい、セルが行の高さいっぱいに広がらず
       内側に余計な罫線があるように見える不具合の原因だった。tdへは何のdisplayも
       指定せず、内部に「客:」「指:」それぞれ1行(nowrap+ellipsis)のdivを最大2つ
       置くだけにする — td自体は通常のtable-cellのまま、外枠だけの記入欄を維持する。 */
    .cs-c-notes {
      overflow: hidden;
    }
    .cs-notice-line, .cs-instruction-line {
      font-size: 3.2mm;
      font-weight: 600;
      line-height: 1.25;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* 全体通信・引継ぎ欄。高さは50mm -> 48mm(2mm削減、2026-09-03)。
       下端の安全余白そのものは上の.cleaning-sheet(283mm->281mm)が作る — この欄は
       通常フローで表の下に置かれるだけで、外枠の固定高さには影響しないため。
       記入欄も同じ2mmぶん詰めて全体の縮小を揃える。48mmでも実記入領域は約37.6mm
       残る(padding 4mm + 見出し約5mmを除いた実測値)ので手書きには十分。
       18室表・行高・列幅・header・RoomNo/人数/泊数のサイズは一切変更していない。 */
    .cs-footer-box {
      border: 1px solid #777777;
      height: 48mm;
      margin-top: 2mm;
      padding: 2mm;
      box-sizing: border-box;
    }

    .cs-footer-title {
      font-size: 3.6mm;
      font-weight: 700;
      margin-bottom: 1mm;
    }

    .no-print a {
      color: #2f6fed;
      font-size: 3.4mm;
    }
  </style>
</head>
<body>
  <div class="no-print">
    <a href="/">← 戻る / Back</a>
  </div>

  <div id="cs-print-content">
    <p class="no-print" id="cs-loading-label">読み込み中…</p>
  </div>

  <script type="module" src="./print-cleaning.js"></script>
</body>
</html>
