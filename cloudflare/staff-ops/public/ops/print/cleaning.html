<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>清掃・客室指示表 — 喜らく</title>
  <style>
    /* FINAL DESIGN — 確定仕様。白黒/最小限のスタイルのみ(角丸・影・カード風UI・
       ヘッダー以外の色は使わない)。ロゴ不要。 */
    @page {
      size: A4 portrait;
      margin: 7mm;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      background: #ffffff;
    }

    body {
      color: #111111;
      font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", system-ui, sans-serif;
    }

    table {
      border-collapse: collapse;
      table-layout: fixed;
    }

    th, td {
      border: 1px solid #777777;
      box-sizing: border-box;
    }

    @media print {
      .no-print { display: none !important; }
    }

    .cleaning-sheet {
      width: 196mm;
      height: 283mm;
      margin: 0 auto;
      box-sizing: border-box;
    }

    .cs-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      height: 13mm;
      margin-bottom: 2mm;
    }

    .cs-header-date { font-size: 4mm; }
    .cs-header-title { font-size: 5mm; font-weight: 700; }
    .cs-header-property { font-size: 4mm; font-weight: 700; }

    .cs-unassigned-warning {
      font-size: 3.2mm;
      color: #111111;
      margin: 0 0 2mm 0;
    }

    .cs-main-table {
      width: 196mm;
    }

    .cs-main-table thead tr { height: 7.5mm; }

    .cs-main-table th {
      background: #f3f3f3;
      font-size: 2.8mm;
      font-weight: 600;
      padding: 0.8mm;
      text-align: center;
      vertical-align: middle;
      white-space: nowrap;
    }

    .cs-main-table tbody tr { height: 10.5mm; }

    .cs-main-table td {
      font-size: 2.8mm;
      padding: 1mm 1.2mm;
      vertical-align: middle;
      overflow: hidden;
    }

    .cs-c-room {
      font-weight: 700;
      font-size: 4mm;
      text-align: center;
    }

    .cs-c-guest, .cs-c-notes { text-align: left; }

    .cs-c-count, .cs-c-nights, .cs-c-status,
    .cs-c-in, .cs-c-out, .cs-c-arrival, .cs-c-ota {
      text-align: center;
    }

    /* 備考・通信セル：外枠(表全体の罫線)のみを残した無地の記入欄。かつて2行clamp用に
       display:-webkit-box を指定していたが、これは<td>に必須のdisplay:table-cellを
       上書きしてしまい、セルが行の高さいっぱいに広がらず内側に余計な罫線があるように
       見える不具合の原因だった。単純にoverflow:hiddenのみで十分。 */
    .cs-c-notes {
      overflow: hidden;
    }

    .cs-footer-box {
      border: 1px solid #777777;
      height: 50mm;
      margin-top: 2mm;
      padding: 2mm;
      box-sizing: border-box;
    }

    .cs-footer-title {
      font-size: 3.4mm;
      font-weight: 700;
      margin-bottom: 1mm;
    }

    .no-print a {
      color: #2f6fed;
      font-size: 3.4mm;
    }
  </style>
</head>
<body>
  <div class="no-print">
    <a href="/">← 戻る / Back</a>
  </div>

  <div id="cs-print-content">
    <p class="no-print" id="cs-loading-label">読み込み中…</p>
  </div>

  <script type="module" src="./print-cleaning.js"></script>
</body>
</html>
