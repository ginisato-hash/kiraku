<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>清掃 本日 — 喜らく</title>
  <link rel="stylesheet" href="../styles.css" />
  <style>
    /* モバイル清掃ビュー（FINAL）: 印刷帳票を縮小したものではなく、1室=1ブロックの
       独自レイアウト。70歳超スタッフを含む現場従業員向けに大きな文字/高コントラスト/
       単純な1カラムを維持する。閲覧専用（開始/完了/担当割当等のボタンは無し）。 */
    body {
      font-size: 16px;
    }

    .mc-shell {
      max-width: 480px;
      margin: 0 auto;
      padding: 16px;
    }

    .mc-date {
      font-size: 1.6rem;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .mc-freshness {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-bottom: 20px;
      min-height: 1.2em;
    }

    .mc-room-block {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 20px;
      margin-bottom: 16px;
    }

    .mc-room-vacant {
      padding: 14px 20px;
      opacity: 0.7;
    }

    /* 最も目立つ要素: 室番号。このCSS内で最大のfont-size。 */
    .mc-room-number {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .mc-room-vacant .mc-room-number {
      margin-bottom: 2px;
    }

    .mc-vacant-label {
      font-size: 1.05rem;
      color: var(--text-muted);
    }

    .mc-status-badge {
      display: inline-block;
      border-radius: 999px;
      padding: 6px 16px;
      font-size: 1.05rem;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .mc-status-TURNOVER { background: var(--red-bg); color: var(--red); }
    .mc-status-STAYOVER { background: var(--blue-bg); color: var(--blue); }
    .mc-status-CHECKIN { background: var(--amber-bg); color: var(--amber); }
    .mc-status-CHECKOUT { background: var(--amber-bg); color: var(--amber); }

    .mc-guest-name {
      font-size: 1.15rem;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .mc-detail-line {
      font-size: 1rem;
      margin-bottom: 6px;
      color: var(--text);
    }

    .mc-instruction {
      font-size: 1rem;
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid var(--border);
      color: var(--text);
    }

    .mc-empty {
      font-size: 1.2rem;
      text-align: center;
      padding: 40px 16px;
      color: var(--text-faint);
    }
  </style>
</head>
<body>
  <div class="mc-shell">
    <div class="mc-date" id="mc-date">—</div>
    <div class="mc-freshness" id="mc-freshness"></div>
    <div id="mc-room-list"></div>
  </div>

  <script type="module" src="./today.js"></script>
</body>
</html>
