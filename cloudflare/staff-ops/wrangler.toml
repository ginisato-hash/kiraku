name = "kiraku-staff-ops"
main = "src/worker.js"
compatibility_date = "2026-07-08"

# HTML/JS/CSS は Static Assets から配信（staff-ops データは同梱しない）
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"

# staff_ops_snapshot.json（到着/出発/連泊/清掃データ）は R2 の latest/ から読むだけ。
# Beds24 APIはここでは呼ばない。データパイプラインは別プロセスが15分毎に公開する。
[[r2_buckets]]
binding = "OPS_DATA"
bucket_name = "kiraku-staff-ops-data"

# 清掃指示のroom_number/notes上書き（POST /api/cleaning/override）専用のKV。
# 必須機能（任意機能ではない）。real KV namespace idはCIで自動払い出す
# （deploy-staff-worker.yml「Ensure KV namespace exists」ステップ）ため、
# このplaceholderのままにしておくこと。CIには現状 Workers KV Storage: Edit
# 権限が無くこのステップ自体が失敗するため、KV権限が追加されるまでは
# Worker全体のdeployが通らない（worker.js自体はbinding未解決でも安全に
# 動作するよう書かれているが、wrangler deployはbinding先IDを解決できないと
# 失敗するため、実質的にはWorkers Scripts:Edit権限の欠如と合わせて解消が必要）。
# 状況は cloudflare/staff-ops/ACCESS_SETUP.md 参照。
[[kv_namespaces]]
binding = "CLEANING_OVERRIDES"
id = "REPLACE_WITH_REAL_KV_ID"
