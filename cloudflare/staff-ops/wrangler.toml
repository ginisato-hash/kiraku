name = "kiraku-staff-ops"
main = "src/worker.js"
compatibility_date = "2026-07-08"

# HTML/JS/CSS は Static Assets から配信（staff-ops データは同梱しない）
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"

# staff_ops_snapshot.json（到着/出発/連泊/清掃データ）は R2 の latest/ から読むだけ。
# Beds24 APIはここでは呼ばない。データパイプラインは別プロセスが15分毎に公開する。
[[r2_buckets]]
binding = "OPS_DATA"
bucket_name = "kiraku-staff-ops-data"

# 清掃指示のroom_number/notes上書き（POST /api/cleaning/override）専用のKV。
#
# 【一時的に無効化・要フォローアップ】既存 CLOUDFLARE_API_TOKEN (GitHub Secrets) には
# 現状 R2/Workers の編集権限はあるが、KVネームスペース作成に必要な権限
# (Workers KV Storage: Edit) が無く、CIでの自動払い出しに失敗する
# (Cloudflare API: "Authentication error [code: 10000]")。worker.js側は
# env.CLEANING_OVERRIDES が未定義でも安全に動作する(読み取りは空扱い、
# 書き込みは500 kv_unavailableを返すのみでクラッシュしない)ため、コア機能
# (Daily Ops / 宿泊者名簿印刷 / 清掃指示表示)を先に本番稼働させるためこの
# bindingだけ一旦外す。有効化手順は cloudflare/staff-ops/ACCESS_SETUP.md 参照。
#
# [[kv_namespaces]]
# binding = "CLEANING_OVERRIDES"
# id = "REPLACE_WITH_REAL_KV_ID"
