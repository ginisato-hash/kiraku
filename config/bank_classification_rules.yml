# 銀行口座実績レイヤー 費目候補分類ルール（喜らく単体・BI/固定費変動費モデル更新候補専用）。
#
# 重要: これは会計仕訳を作る journal_rules.yml とは別物。
#   - ここでの分類結果は「候補(candidate)」であり、確定仕訳にも config/fixed_variable_model.yml にも
#     自動反映されない。人間の確認を経てから反映する。
#   - 個人名らしき摘要は confidence を上げず、必ず requires_review: true にする。
#   - webで根拠を確認できたものは evidence_source_url / evidence_summary / researched_at_jst を残す。
#
# 上から順に評価し、最初にマッチしたルールを採用する。
# match:
#   counterparty_contains: 摘要(正規化前の生文字列)にいずれかを含む
#   direction: deposit(入金) / withdrawal(出金) / any
#   amount_min / amount_max: 絶対値範囲(円)
# action:
#   cost_model_category / fixed_or_variable / cashflow_category / business_area /
#   confidence(high/medium/low) / reason / requires_review(true/false) /
#   auto_reflectable(true = Phase4の高信頼config反映候補リストに乗せてよい)

rules:
  # --- 銀行手数料（high・auto_reflectable）---
  - id: bank_actual_furikomi_fee
    match: {counterparty_contains: [ﾌﾘｺﾐﾃｽｳﾘﾖｳ, 振込手数料], direction: withdrawal}
    action: {cost_model_category: bank_fee, fixed_or_variable: fixed,
             cashflow_category: operating_outflow, business_area: bank_fee,
             confidence: high, requires_review: false, auto_reflectable: true,
             reason: "摘要が「振込手数料」と明確一致。銀行手数料として自動確定可能。"}
  - id: bank_actual_fbib_fee
    match: {counterparty_contains: [FBIBﾃｽｳﾘﾖｳ, FBIB手数料], direction: withdrawal}
    action: {cost_model_category: bank_fee, fixed_or_variable: fixed,
             cashflow_category: operating_outflow, business_area: bank_fee,
             confidence: high, requires_review: false, auto_reflectable: true,
             reason: "FBIB(ファームバンキング/インターネットバンキング)手数料。"}
  - id: bank_actual_kawase_fee
    match: {counterparty_contains: [ｶﾜｾﾃｽｳﾘﾖｳ, 為替手数料], direction: withdrawal}
    action: {cost_model_category: bank_fee, fixed_or_variable: fixed,
             cashflow_category: operating_outflow, business_area: bank_fee,
             confidence: high, requires_review: false, auto_reflectable: true,
             reason: "摘要が「為替手数料」と明確一致。"}

  # --- 債務返済（high・auto_reflectable）---
  - id: bank_actual_policy_finance_corp
    match: {counterparty_contains: [ｾｲｻｸｺｳｺ, 政策公庫], direction: withdrawal}
    action: {cost_model_category: debt_service_bank, fixed_or_variable: debt_service,
             cashflow_category: financing_outflow, business_area: debt,
             confidence: high, requires_review: false, auto_reflectable: true,
             reason: "「政策公庫」「国民」の表記から日本政策金融公庫(国民生活事業)への毎月の元利返済と判断。既存journal_rules.ymlでも同名で高信頼登録済み。"}

  # --- 税理士報酬（high・auto_reflectable）---
