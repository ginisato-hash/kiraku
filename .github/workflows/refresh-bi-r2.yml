name: Refresh BI R2

# 喜らく速報BIの本番自動更新（主経路）。
# Beds24 APIから最新予約データを取得し、速報BI(JSON/CSV)を生成してR2 latest/へpublishするだけ。
# 仕訳生成・PL/BS/CF確定・Excel更新・月次締め処理は一切行わない。
# Worker本体はここではdeployしない（cloudflare/bi-web/変更時のみ deploy-worker.yml が担当）。
# Beds24 token・Cloudflare credentialはこのworkflowのSecretsにのみ置き、Worker側には置かない。

on:
  # 15分周期の起動はCloudflare Cron Trigger（cloudflare/bi-web/wrangler.toml
  # [triggers] crons = ["3,18,33,48 * * * *"]、cloudflare/bi-web/src/worker.js
  # の scheduled()）がworkflow_dispatchを叩く形に一本化した。GitHub Actions
  # 自身のon.scheduleは信頼性が低く（fc1ffca参照：549回期待に対し実行100回、
  # 最大687分のsilent gapを実測）、Cloudflare側の経路が2026-08-29に本番検証
  # 済み（手動+自律発火とも成功、production freshness ~1-2分）のため撤去。
  workflow_dispatch:

concurrency:
  group: refresh-bi-r2
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh-bi-r2:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    env:
      TZ: Asia/Tokyo
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Set up Node (for wrangler)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Validate secrets
        env:
          BEDS24_API_TOKEN: ${{ secrets.BEDS24_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_R2_BUCKET: ${{ secrets.CLOUDFLARE_R2_BUCKET }}
        run: |
          # secret値そのものは絶対に表示しない。欠けているsecret名だけ報告する。
          missing=0
          for name in BEDS24_API_TOKEN CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN CLOUDFLARE_R2_BUCKET; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is missing. Set it at Settings > Secrets and variables > Actions."
              missing=1
            else
              echo "$name is set"
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Refresh BI from Beds24
        env:
          # コードが実際に読む env var 名は BEDS24_LONG_LIFE_TOKEN（Secret名は統一のためBEDS24_API_TOKENのまま）。
          BEDS24_LONG_LIFE_TOKEN: ${{ secrets.BEDS24_API_TOKEN }}
          # 喜らく単体のプロパティID。機密情報ではないため平文で固定（他物件を誤って取得しないため必須）。
          BEDS24_PROPERTY_IDS: "330695"
          TZ: Asia/Tokyo
        run: |
          yuge-finance refresh-beds24-bi --auto-months-with-bookings --publish

      - name: Publish BI to R2
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_R2_BUCKET: ${{ secrets.CLOUDFLARE_R2_BUCKET }}
          TZ: Asia/Tokyo
        run: |
          yuge-finance publish-bi-r2 --bucket "$CLOUDFLARE_R2_BUCKET" --preserve-bank-fields-from-r2

      # 補助確認のみ。主検証はrefresh-beds24-bi/publish-bi-r2のexit codeで既に厳密に行っている
      # （publish-bi-r2は成功時に generated_at_jst / default_month / uploaded files を出力済み）。
      # CloudflareがPython urllibの既定UAを弾いて403を返すことがあるため、User-Agentを明示し、
      # かつ このstep自体の失敗でworkflow全体をfailedにしない(continue-on-error)。
      - name: Verify public manifest
        continue-on-error: true
        run: |
          python - <<'PY'
          import json
          import urllib.error
          import urllib.request

          url = "https://kiraku-bi.s-sato-dce.workers.dev/api/manifest"
          req = urllib.request.Request(
              url,
              headers={
                  "User-Agent": "kiraku-bi-refresh-github-actions/1.0",
                  "Accept": "application/json",
              },
          )
          try:
              with urllib.request.urlopen(req, timeout=30) as r:
                  data = json.load(r)
              print("public generated_at_jst=", data.get("generated_at_jst"))
              print("default_month=", data.get("default_month"))
              if not data.get("generated_at_jst"):
                  raise SystemExit("generated_at_jst missing")
          except urllib.error.HTTPError as e:
              print(f"::warning::public manifest verification returned HTTP {e.code}; R2 publish already succeeded")
          except Exception as e:
              print(f"::warning::public manifest verification failed: {e}; R2 publish already succeeded")
          PY

      - name: Write job summary
        if: always()
        run: |
          echo "## Refresh BI R2" >> "$GITHUB_STEP_SUMMARY"
          echo "- finished_at_utc: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> "$GITHUB_STEP_SUMMARY"
          echo "- workflow_status: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- public_manifest:" >> "$GITHUB_STEP_SUMMARY"
          curl -fsSL \
            --retry 2 \
            --retry-delay 3 \
            -H "User-Agent: kiraku-bi-refresh-github-actions/1.0" \
            -H "Accept: application/json" \
            https://kiraku-bi.s-sato-dce.workers.dev/api/manifest \
            | python3 -m json.tool \
            | grep -E "generated_at_jst|default_month" \
            >> "$GITHUB_STEP_SUMMARY" || echo "public manifest unavailable from GitHub runner" >> "$GITHUB_STEP_SUMMARY"
          echo "- public_snapshot:" >> "$GITHUB_STEP_SUMMARY"
          curl -fsSL \
            --retry 2 \
            --retry-delay 3 \
            -H "User-Agent: kiraku-bi-refresh-github-actions/1.0" \
            -H "Accept: application/json" \
            https://kiraku-bi.s-sato-dce.workers.dev/api/snapshot \
            | python3 -m json.tool \
            | grep -E "generated_at_jst|today_jst|bank_fields_source|bank_actual_latest_balance|bank_csv_import_status" \
            >> "$GITHUB_STEP_SUMMARY" || echo "public snapshot unavailable from GitHub runner" >> "$GITHUB_STEP_SUMMARY"
