name: Refresh BI R2

# 喜らく速報BIの本番自動更新（主経路）。
# Beds24 APIから最新予約データを取得し、速報BI(JSON/CSV)を生成してR2 latest/へpublishするだけ。
# 仕訳生成・PL/BS/CF確定・Excel更新・月次締め処理は一切行わない。
# Worker本体はここではdeployしない（cloudflare/bi-web/変更時のみ deploy-worker.yml が担当）。
# Beds24 token・Cloudflare credentialはこのworkflowのSecretsにのみ置き、Worker側には置かない。

on:
  # 15分周期の起動はCloudflare Cron Trigger（cloudflare/bi-web/wrangler.toml
  # [triggers] crons = ["3,18,33,48 * * * *"]、cloudflare/bi-web/src/worker.js
  # の scheduled()）がworkflow_dispatchを叩く形に一本化した。GitHub Actions
  # 自身のon.scheduleは信頼性が低く（fc1ffca参照：549回期待に対し実行100回、
  # 最大687分のsilent gapを実測）、Cloudflare側の経路が2026-08-29に本番検証
  # 済み（手動+自律発火とも成功、production freshness ~1-2分）のため撤去。
  #
  # dispatch_id/target_seq/reason はCloudflare側のBiRefreshCoordinator
  # Durable Object（event-driven BI refresh移行、cloudflare/bi-web/src/
  # biRefreshCoordinator.js）がactive modeでdispatchする際にだけ渡す。
  # 3つとも任意（既定=空文字）なので、`gh workflow run refresh-bi-r2.yml`の
  # ような既存の手動実行はこれまで通りinputs無しで動く。dispatch_idが空の
  # 場合、末尾のcompletion callback stepは「Coordinator起点ではない実行」
  # と判断してcallback送信自体をスキップする（後方互換 — 項目23/32参照）。
  workflow_dispatch:
    inputs:
      dispatch_id:
        description: "BiRefreshCoordinatorが発行したdispatch id（手動実行では空のままでよい）"
        required: false
        default: ""
      target_seq:
        description: "このdispatchが取り込むevent_seqのスナップショット（手動実行では空のままでよい）"
        required: false
        default: ""
      reason:
        description: "dispatch理由（booking_webhook/full_reconciliation/jst_date_rollover/manual_force/manual）"
        required: false
        default: "manual"

concurrency:
  group: refresh-bi-r2
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh-bi-r2:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    env:
      TZ: Asia/Tokyo
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Set up Node (for wrangler)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Validate secrets
        env:
          BEDS24_API_TOKEN: ${{ secrets.BEDS24_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_R2_BUCKET: ${{ secrets.CLOUDFLARE_R2_BUCKET }}
        run: |
          # secret値そのものは絶対に表示しない。欠けているsecret名だけ報告する。
          missing=0
          for name in BEDS24_API_TOKEN CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN CLOUDFLARE_R2_BUCKET; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is missing. Set it at Settings > Secrets and variables > Actions."
              missing=1
            else
              echo "$name is set"
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      # --- Shadow semantic false-negative observation (KIRAKU BI PHASE 2) ---
      # Beds24's Booking Webhook does not fire for every field change that
      # matters to BI/Staff Ops, so before active mode can be trusted we need
      # to measure how often a would-have-been-skipped cycle
      # (reason=shadow_unconditional) actually produced a meaningful change.
      # These steps only ever produce/consume the opaque status strings
      # changed/unchanged/no_baseline/skipped/error — never booking or guest
      # content — and never fail the job (continue-on-error: true), per the
      # "observability failure < BI/Staff Ops freshness" principle (item 13).
      #
      # Comparison order (independent review blocker 2): each component's
      # baseline is captured BEFORE its refresh/export, but the semantic
      # compare step runs AFTER that component's R2 publish, not before.
      # For BI specifically, publish-bi-r2 --preserve-bank-fields-from-r2
      # mutates the local snapshot files (restoring bank_* fields from the
      # previous public snapshot when this run has no local bank CSV, which
      # is always true on GitHub Actions) BEFORE uploading them — comparing
      # before that mutation would compare a pre-publish intermediate that
      # production never actually serves. Because the compare steps below
      # have no `if:` of their own beyond continue-on-error, they inherit
      # the implicit `success()` check: if the corresponding publish step
      # fails, the compare step is skipped entirely, its output is empty,
      # and "Report shadow observation" below maps that to bi_status/
      # staff_ops_status=error rather than treating an unpublished local
      # change as a real (false-negative-eligible) production change
      # (independent review blocker 5).
      - name: Capture previous BI snapshot (shadow observation baseline)
        id: shadow_bi_baseline
        continue-on-error: true
        run: |
          yuge-finance shadow-observe-capture-baseline --component bi \
            --out "$RUNNER_TEMP/shadow_obs_bi_old.json"

      - name: Capture previous Staff Ops snapshot (shadow observation baseline)
        id: shadow_staffops_baseline
        if: ${{ vars.STAFF_OPS_AUTH_CONFIRMED == '1' }}
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          yuge-finance shadow-observe-capture-baseline --component staff_ops \
            --out "$RUNNER_TEMP/shadow_obs_staffops_old.json"

      - name: Refresh BI from Beds24
        id: refresh_bi
        env:
          # コードが実際に読む env var 名は BEDS24_LONG_LIFE_TOKEN（Secret名は統一のためBEDS24_API_TOKENのまま）。
          BEDS24_LONG_LIFE_TOKEN: ${{ secrets.BEDS24_API_TOKEN }}
          # 喜らく単体のプロパティID。機密情報ではないため平文で固定（他物件を誤って取得しないため必須）。
          BEDS24_PROPERTY_IDS: "330695"
          TZ: Asia/Tokyo
        run: |
          yuge-finance refresh-beds24-bi --auto-months-with-bookings --publish

      - name: Publish BI to R2
        id: publish_r2
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_R2_BUCKET: ${{ secrets.CLOUDFLARE_R2_BUCKET }}
          TZ: Asia/Tokyo
        run: |
          yuge-finance publish-bi-r2 --bucket "$CLOUDFLARE_R2_BUCKET" --preserve-bank-fields-from-r2

      # Runs AFTER publish (see comment above) — compares against the
      # FINALIZED local snapshot files (post sticky-bank restoration), which
      # is what was actually just uploaded to production R2.
      - name: Compare BI snapshot semantics (shadow observation)
        id: shadow_bi_semantic
        continue-on-error: true
        run: |
          yuge-finance shadow-observe-compare --component bi \
            --old "$RUNNER_TEMP/shadow_obs_bi_old.json"

      # --- ここから Staff Daily Ops / 清掃指示書 用データ（財務情報を一切含まない別系統）---
      # 既存BI(latest/bi_snapshot.json等、売上・ADR等を含む)とは完全に別バケット(kiraku-staff-ops-data)。
      # 取得元は本ジョブが直前に取得した同じBeds24生データ(data/raw/beds24/)であり、二重取得はしない。
      #
      # ゲート: STAFF_OPS_AUTH_CONFIRMED という repository variable が "1" になるまで、
      # 実在の宿泊者氏名・電話番号・住所を含むデータはR2へ一切書き込まない（ステップごと
      # スキップ）。kiraku-staff-ops Workerの本番URLはコード上デプロイ済みでも、
      # スタッフ共通パスワード認証（STAFF_OPS_PASSWORD/STAFF_OPS_SESSION_SECRET、
      # cloudflare/staff-ops/AUTH_SETUP.md参照）が本番で実際に動作確認されるまでは、
      # 「秘密URLだけがセキュリティ」という状態になり得るため、それを避けるための
      # 明示的な運用者ゲート（このリポジトリの既存RMS authorizationパターンと同じ思想）。
      # 設定手順: GitHub → Settings → Secrets and variables → Actions → Variables タブで
      # STAFF_OPS_AUTH_CONFIRMED=1 を追加する（パスワード認証の本番動作確認後に）。
      - name: Export Daily Ops + cleaning data (no financial fields)
        id: staff_ops_export
        if: ${{ vars.STAFF_OPS_AUTH_CONFIRMED == '1' }}
        env:
          TZ: Asia/Tokyo
        run: |
          yuge-finance export-daily-ops

      - name: Staff Ops data gate not yet open (Cloudflare Access unconfirmed)
        if: ${{ vars.STAFF_OPS_AUTH_CONFIRMED != '1' }}
        run: |
          echo "::warning::STAFF_OPS_AUTH_CONFIRMED repository variable is not '1' — skipping Daily Ops/cleaning data export+publish. See cloudflare/staff-ops/AUTH_SETUP.md. The kiraku-staff-ops Worker stays deployed but its R2 bucket stays empty (safe 404/empty-state) until this gate is opened."

      - name: Ensure staff-ops R2 bucket exists
        id: staff_ops_r2_bucket
        if: ${{ vars.STAFF_OPS_AUTH_CONFIRMED == '1' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if wrangler r2 bucket create kiraku-staff-ops-data 2>&1 | tee /tmp/r2-create-ops.log; then
            echo "R2 bucket ensured (created or already existed)."
          else
            if grep -qi "already exists" /tmp/r2-create-ops.log; then
              echo "R2 bucket already existed."
            else
              echo "::error::Failed to ensure R2 bucket kiraku-staff-ops-data. See log above."
              exit 1
            fi
          fi

      - name: Publish Daily Ops data to R2
        id: staff_ops_r2_publish
        if: ${{ vars.STAFF_OPS_AUTH_CONFIRMED == '1' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          # R2側の一時的な500 Internal Server Error(code 10001)対策。object putは
          # 対象keyを丸ごと上書きするだけの冪等操作なので再試行しても安全
          # (src/yuge_finance/publish_r2.py の _put() と同じ根拠、2026-09-06障害対応)。
          for attempt in 1 2 3; do
            if wrangler r2 object put kiraku-staff-ops-data/latest/staff_ops_snapshot.json \
              --file data/output/latest/ops/staff_ops_snapshot.json \
              --content-type application/json \
              --remote; then
              exit 0
            fi
            echo "::warning::Publish Daily Ops data to R2 attempt $attempt failed"
            [ "$attempt" -lt 3 ] && sleep 5
          done
          exit 1

      # Runs AFTER "Publish Daily Ops data to R2" (see the BI comparison
      # order comment above) — same rationale: compare the payload that was
      # actually just published, not a pre-publish intermediate. Staff Ops
      # export has no sticky-field mutation step of its own today, but the
      # ordering keeps both components consistent and future-proof if one
      # is ever added.
      - name: Compare Staff Ops snapshot semantics (shadow observation)
        id: shadow_staffops_semantic
        if: ${{ vars.STAFF_OPS_AUTH_CONFIRMED == '1' }}
        continue-on-error: true
        run: |
          yuge-finance shadow-observe-compare --component staff_ops \
            --old "$RUNNER_TEMP/shadow_obs_staffops_old.json"

      # 補助確認のみ。主検証はrefresh-beds24-bi/publish-bi-r2のexit codeで既に厳密に行っている
      # （publish-bi-r2は成功時に generated_at_jst / default_month / uploaded files を出力済み）。
      # CloudflareがPython urllibの既定UAを弾いて403を返すことがあるため、User-Agentを明示し、
      # かつ このstep自体の失敗でworkflow全体をfailedにしない(continue-on-error)。
      - name: Verify public manifest
        continue-on-error: true
        run: |
          python - <<'PY'
          import json
          import urllib.error
          import urllib.request

          url = "https://kiraku-bi.s-sato-dce.workers.dev/api/manifest"
          req = urllib.request.Request(
              url,
              headers={
                  "User-Agent": "kiraku-bi-refresh-github-actions/1.0",
                  "Accept": "application/json",
              },
          )
          try:
              with urllib.request.urlopen(req, timeout=30) as r:
                  data = json.load(r)
              print("public generated_at_jst=", data.get("generated_at_jst"))
              print("default_month=", data.get("default_month"))
              if not data.get("generated_at_jst"):
                  raise SystemExit("generated_at_jst missing")
          except urllib.error.HTTPError as e:
              print(f"::warning::public manifest verification returned HTTP {e.code}; R2 publish already succeeded")
          except Exception as e:
              print(f"::warning::public manifest verification failed: {e}; R2 publish already succeeded")
          PY

      - name: Write job summary
        if: always()
        run: |
          echo "## Refresh BI R2" >> "$GITHUB_STEP_SUMMARY"
          echo "- finished_at_utc: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> "$GITHUB_STEP_SUMMARY"
          echo "- workflow_status: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- public_manifest:" >> "$GITHUB_STEP_SUMMARY"
          curl -fsSL \
            --retry 2 \
            --retry-delay 3 \
            -H "User-Agent: kiraku-bi-refresh-github-actions/1.0" \
            -H "Accept: application/json" \
            https://kiraku-bi.s-sato-dce.workers.dev/api/manifest \
            | python3 -m json.tool \
            | grep -E "generated_at_jst|default_month" \
            >> "$GITHUB_STEP_SUMMARY" || echo "public manifest unavailable from GitHub runner" >> "$GITHUB_STEP_SUMMARY"
          echo "- public_snapshot:" >> "$GITHUB_STEP_SUMMARY"
          curl -fsSL \
            --retry 2 \
            --retry-delay 3 \
            -H "User-Agent: kiraku-bi-refresh-github-actions/1.0" \
            -H "Accept: application/json" \
            https://kiraku-bi.s-sato-dce.workers.dev/api/snapshot \
            | python3 -m json.tool \
            | grep -E "generated_at_jst|today_jst|bank_fields_source|bank_actual_latest_balance|bank_csv_import_status" \
            >> "$GITHUB_STEP_SUMMARY" || echo "public snapshot unavailable from GitHub runner" >> "$GITHUB_STEP_SUMMARY"

      # event-driven BI refresh移行（BiRefreshCoordinator Durable Object）用の
      # completion callback。dispatch_id input が空（＝Coordinator起点ではない
      # 手動実行、または移行前の後方互換呼び出し）の場合は何もせず正常終了する。
      # `if: always()` — main jobが途中失敗してもfailure callbackを試みる
      # (項目15)。ただしこのstep自体の失敗が元のjob結果の意味を隠さないよう、
      # 常にexit 0で終える（実際の成否は上のsteps自体のjob.statusで既に確定
      # している）。secret値・payload本体は絶対にログしない — HTTPステータス
      # コードのみ報告する。
      - name: Report completion to BI Refresh Coordinator
        if: always()
        env:
          BI_REFRESH_CALLBACK_SECRET: ${{ secrets.BI_REFRESH_CALLBACK_SECRET }}
          DISPATCH_ID: ${{ inputs.dispatch_id }}
          TARGET_SEQ: ${{ inputs.target_seq }}
          REASON: ${{ inputs.reason }}
          REFRESH_OUTCOME: ${{ steps.refresh_bi.outcome }}
          PUBLISH_OUTCOME: ${{ steps.publish_r2.outcome }}
          STAFF_OPS_EXPORT_OUTCOME: ${{ steps.staff_ops_export.outcome }}
          STAFF_OPS_R2_BUCKET_OUTCOME: ${{ steps.staff_ops_r2_bucket.outcome }}
          STAFF_OPS_R2_PUBLISH_OUTCOME: ${{ steps.staff_ops_r2_publish.outcome }}
        run: |
          set -uo pipefail
          if [ -z "${DISPATCH_ID:-}" ]; then
            echo "No dispatch_id input (manual run without Coordinator context) — skipping completion callback."
            exit 0
          fi
          if [ -z "${BI_REFRESH_CALLBACK_SECRET:-}" ]; then
            echo "::warning::BI_REFRESH_CALLBACK_SECRET is not set — cannot report completion to the Coordinator. Set it at Settings > Secrets and variables > Actions. The Coordinator's lease-timeout recovery will treat this dispatch as stale and retry it."
            exit 0
          fi

          # status=success means: every critical production publication this
          # run is responsible for actually succeeded. refresh_bi/publish_r2
          # always run, so they must be exactly "success". The Staff Ops
          # steps are gated by vars.STAFF_OPS_AUTH_CONFIRMED and legitimately
          # report "skipped" when that gate is closed — that's not a failure.
          # Anything else ("failure", "cancelled", or a step that somehow
          # never got an outcome at all) makes the whole run a failure, even
          # if refresh_bi/publish_r2 themselves succeeded — e.g. BI refresh
          # OK but the Staff Ops R2 publish failed must not be acknowledged
          # as success (fix round blocker 2).
          call_status="success"
          if [ "${REFRESH_OUTCOME:-}" != "success" ] || [ "${PUBLISH_OUTCOME:-}" != "success" ]; then
            call_status="failure"
          fi
          for outcome in "${STAFF_OPS_EXPORT_OUTCOME:-}" "${STAFF_OPS_R2_BUCKET_OUTCOME:-}" "${STAFF_OPS_R2_PUBLISH_OUTCOME:-}"; do
            if [ "$outcome" != "success" ] && [ "$outcome" != "skipped" ]; then
              call_status="failure"
            fi
          done
          completed_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          # jq -n --arg で組み立てる（値はすべてシェル変数展開ではなく--argで
          # 渡すため、JSON injectionの心配が無い）。target_seqは数値が来る
          # 前提だが、想定外の非数値が来た場合はnullにフォールバックし、
          # 400として素直にCoordinator側でrejectさせる（このstep自体は
          # 落とさない）。
          payload=$(jq -n \
            --arg dispatch_id "$DISPATCH_ID" \
            --arg target_seq "$TARGET_SEQ" \
            --arg status "$call_status" \
            --arg reason "$REASON" \
            --arg completed_at "$completed_at" \
            '{
              dispatch_id: $dispatch_id,
              target_seq: (if ($target_seq | test("^[0-9]+$")) then ($target_seq | tonumber) else null end),
              status: $status,
              reason: (if $reason == "" then null else $reason end),
              completed_at: $completed_at
            }')

          http_code=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            "https://kiraku-bi.s-sato-dce.workers.dev/internal/bi-refresh/complete" \
            -H "Authorization: Bearer ${BI_REFRESH_CALLBACK_SECRET}" \
            -H "Content-Type: application/json" \
            --max-time 20 \
            -d "$payload") || http_code="curl_error"

          # payload本体・secretは出力しない。ステータスと最終判定のcall_statusのみ。
          echo "completion_callback_http_status=${http_code} dispatch_status=${call_status}"
          if [ "$http_code" != "200" ]; then
            echo "::warning::Completion callback did not return 200 (got ${http_code}). The Coordinator's lease-timeout recovery will treat this dispatch as stale and retry it on a later Cron tick — no manual action required."
          fi
          exit 0

      # Shadow semantic false-negative observation report (KIRAKU BI PHASE 2).
      # Separate from "Report completion" above by design (item 11): this is
      # PII-safe aggregate-counter bookkeeping, not dispatch/lease
      # reconciliation, so a bug here can never affect last_completed_seq or
      # in_flight tracking. Same skip-if-manual-run gating as the completion
      # callback (no dispatch_id = not a Coordinator-tracked cycle, don't
      # pollute the aggregate stats). `if: always()` so an observation is
      # still reported (as bi_status=error) when refresh_bi itself failed.
      # Only ever sends dispatch_id (an opaque Coordinator-issued UUID, not
      # guest/booking data) plus the opaque status words below — never
      # snapshot content, never the secret value.
      #
      # dispatch_id is included as an idempotency key (independent review
      # blocker 4): the Coordinator treats a repeated dispatch_id as a
      # no-op for every counter, so a GitHub Actions rerun/retry of this
      # same job can never double-count one 15-minute cycle.
      - name: Report shadow observation to BI Refresh Coordinator
        if: always()
        env:
          BI_REFRESH_CALLBACK_SECRET: ${{ secrets.BI_REFRESH_CALLBACK_SECRET }}
          DISPATCH_ID: ${{ inputs.dispatch_id }}
          REASON: ${{ inputs.reason }}
          BI_STATUS: ${{ steps.shadow_bi_semantic.outputs.status }}
          STAFF_OPS_STATUS: ${{ steps.shadow_staffops_semantic.outputs.status }}
          STAFF_OPS_GATE_OPEN: ${{ vars.STAFF_OPS_AUTH_CONFIRMED }}
        run: |
          set -uo pipefail
          if [ -z "${DISPATCH_ID:-}" ]; then
            echo "No dispatch_id input (manual run without Coordinator context) — skipping shadow observation report."
            exit 0
          fi
          if [ -z "${BI_REFRESH_CALLBACK_SECRET:-}" ]; then
            echo "::warning::BI_REFRESH_CALLBACK_SECRET is not set — cannot report shadow observation to the Coordinator."
            exit 0
          fi

          # A step that never ran reports an empty output. For BI, the
          # compare step only runs after a successful "Publish BI to R2"
          # (see the step-order comment above), so empty always means the
          # refresh or the publish itself failed — never a real, published
          # change — and must be reported as an observer error, never a
          # false-negative-eligible "changed"/"unchanged" (independent
          # review blocker 5). For Staff Ops, empty is legitimate
          # ("skipped") when the STAFF_OPS_AUTH_CONFIRMED gate is simply
          # closed, but is an error when the gate is OPEN and the compare
          # step was skipped only because a preceding publish step
          # (export/bucket/R2 publish) failed — same blocker 5 rule,
          # applied to the gated component.
          bi_status="${BI_STATUS:-}"
          if [ -z "$bi_status" ]; then bi_status="error"; fi
          staff_ops_status="${STAFF_OPS_STATUS:-}"
          if [ -z "$staff_ops_status" ]; then
            if [ "${STAFF_OPS_GATE_OPEN:-}" = "1" ]; then
              staff_ops_status="error"
            else
              staff_ops_status="skipped"
            fi
          fi
          observed_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          payload=$(jq -n \
            --arg dispatch_id "$DISPATCH_ID" \
            --arg reason "$REASON" \
            --arg bi_status "$bi_status" \
            --arg staff_ops_status "$staff_ops_status" \
            --arg observed_at "$observed_at" \
            '{
              dispatch_id: $dispatch_id,
              reason: (if $reason == "" then "shadow_unconditional" else $reason end),
              bi_status: $bi_status,
              staff_ops_status: $staff_ops_status,
              observed_at: $observed_at
            }')

          http_code=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            "https://kiraku-bi.s-sato-dce.workers.dev/internal/bi-refresh/shadow-observation" \
            -H "Authorization: Bearer ${BI_REFRESH_CALLBACK_SECRET}" \
            -H "Content-Type: application/json" \
            --max-time 20 \
            -d "$payload") || http_code="curl_error"

          # 送るのはenum文字列(bi_status/staff_ops_status/reason)とタイムスタンプのみ。
          echo "shadow_observation_http_status=${http_code} bi_status=${bi_status} staff_ops_status=${staff_ops_status}"
          if [ "$http_code" != "200" ]; then
            echo "::warning::Shadow observation report did not return 200 (got ${http_code}). Non-fatal — does not affect BI/Staff Ops freshness or dispatch tracking."
          fi
          exit 0
