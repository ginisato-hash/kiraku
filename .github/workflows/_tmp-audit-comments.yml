name: TMP Audit Comments Structure

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Run comments-structure audit
        env:
          BEDS24_LONG_LIFE_TOKEN: ${{ secrets.BEDS24_API_TOKEN }}
          BEDS24_PROPERTY_IDS: "330695"
          TZ: Asia/Tokyo
        run: |
          python _tmp_audit_comments_structure.py
