name: TMP Investigate Booking.com Child Age

on:
  workflow_dispatch:
    inputs:
      months:
        description: "Space-separated YYYY-MM list"
        required: true
        default: "2026-03 2026-04 2026-05 2026-06 2026-07 2026-08 2026-09"

permissions:
  contents: read

jobs:
  investigate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Run diagnostic
        env:
          BEDS24_LONG_LIFE_TOKEN: ${{ secrets.BEDS24_API_TOKEN }}
          BEDS24_PROPERTY_IDS: "330695"
          TZ: Asia/Tokyo
        run: |
          python _tmp_investigate_child_age.py ${{ github.event.inputs.months }}
