name: Deploy Cloudflare Worker

# Worker本体（HTML/JS/CSS配信 + R2読み出し）だけをデプロイする。
# BIデータ(latest/*)はデプロイしない。BIデータの更新はMac launchd→publish-bi-r2が担当する。
# 15分ごとにこのworkflowを実行しない（cloudflare/bi-web/配下の変更時のみ）。
# Beds24 API tokenやアカウント機密情報はここに置かない（CLOUDFLARE_API_TOKEN/ACCOUNT_IDのみ）。

on:
  push:
    branches:
      - main
    paths:
      # production-affecting files only — test/**やREADME等の変更ではdeployしない
      # (KIRAKU BI PHASE 2: test-only変更でproduction Worker deployが走っていた不具合の修正)。
      - "cloudflare/bi-web/src/**"
      - "cloudflare/bi-web/public/**"
      - "cloudflare/bi-web/wrangler.toml"
      - "cloudflare/bi-web/package.json"
      - "cloudflare/bi-web/package-lock.json"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy kiraku-bi Worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "cloudflare/bi-web/package-lock.json"

      - name: Install dependencies
        working-directory: cloudflare/bi-web
        run: npm ci

      - name: Deploy Worker
        working-directory: cloudflare/bi-web
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
