name: CI

# Pull request checks only. Never deploys anything, never writes to R2,
# never calls Beds24 or Cloudflare with real credentials — no production
# secret is passed to any job here. This exists so a PR's automated test
# claims are verified on GitHub itself, not only self-reported by whoever
# opened the PR.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install package (with dev/test dependencies)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run pytest
        run: pytest -q

  bi-web-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare/bi-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # wrangler(4.x) requires Node >= 22 (matches deploy-worker.yml).
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "cloudflare/bi-web/package-lock.json"
      - name: Install dependencies
        run: npm ci
      - name: Run test suite
        run: npm test
      - name: wrangler deploy --dry-run (no Cloudflare credentials passed to this job)
        run: npx wrangler deploy --dry-run

  staff-ops-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare/staff-ops
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22" # matches deploy-staff-worker.yml
          cache: "npm"
          cache-dependency-path: "cloudflare/staff-ops/package-lock.json"
      - name: Install dependencies
        run: npm ci
      - name: Run test suite
        run: npm test

  workflow-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyyaml
      - name: Validate every workflow YAML file parses
        run: |
          python3 - <<'PY'
          import glob
          import sys

          import yaml

          failed = False
          for path in sorted(glob.glob(".github/workflows/*.yml")):
              try:
                  yaml.safe_load(open(path, encoding="utf-8"))
                  print(f"OK: {path}")
              except yaml.YAMLError as e:
                  print(f"INVALID: {path}: {e}")
                  failed = True
          sys.exit(1 if failed else 0)
          PY

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan tracked files for committed credentials
        shell: bash
        run: |
          set -euo pipefail
          fail=0

          # Real-looking secret patterns only — deliberately specific enough
          # to not fire on the one known, obviously-fake test fixture token
          # already in this repo's test suite
          # ("ghp_super_secret_value_do_not_leak", which contains
          # underscores a real GitHub token never does).
          declare -a patterns=(
            'ghp_[A-Za-z0-9]{36}'
            'gho_[A-Za-z0-9]{36}'
            'ghu_[A-Za-z0-9]{36}'
            'ghs_[A-Za-z0-9]{36}'
            'ghr_[A-Za-z0-9]{36}'
            'github_pat_[A-Za-z0-9_]{20,}'
            'AKIA[0-9A-Z]{16}'
            'xox[baprs]-[A-Za-z0-9-]{10,}'
            'BEGIN (RSA|OPENSSH|EC|DSA|PGP) PRIVATE KEY'
          )

          for pattern in "${patterns[@]}"; do
            if git grep -InE "$pattern" -- . ':(exclude)*.lock' ':(exclude)package-lock.json'; then
              echo "::error::possible committed credential matching pattern: $pattern"
              fail=1
            fi
          done

          if git ls-files | grep -E '(^|/)\.env$|(^|/)\.env\.[^.]+$' | grep -v '\.env\.example$'; then
            echo "::error::a .env file is tracked in git"
            fail=1
          fi

          exit "$fail"
