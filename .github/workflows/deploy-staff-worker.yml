name: Deploy Staff Ops Worker

# staff-ops Worker（Daily Ops / 清掃指示書 / 宿泊者名簿印刷）だけをデプロイする。
# 既存 kiraku-bi Worker (deploy-worker.yml) とは完全に別デプロイ経路・別R2バケット・別KVネームスペース。
# データ(latest/staff_ops_snapshot.json)はここではpublishしない。refresh-bi-r2.ymlが担当する。
# R2バケット・KVネームスペースは初回デプロイ時に存在しなければ自動作成する（冪等）。
# Cloudflare Access（アクセス制御）はこのworkflowでは設定しない — 別途手動でのZero Trust設定が必要。

on:
  push:
    branches:
      - main
    paths:
      - "cloudflare/staff-ops/**"
      - ".github/workflows/deploy-staff-worker.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy kiraku-staff-ops Worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "cloudflare/staff-ops/package-lock.json"

      - name: Install dependencies
        working-directory: cloudflare/staff-ops
        run: npm ci

      - name: Ensure R2 bucket exists
        working-directory: cloudflare/staff-ops
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if npx wrangler r2 bucket create kiraku-staff-ops-data 2>&1 | tee /tmp/r2-create.log; then
            echo "R2 bucket ensured (created or already existed)."
          else
            if grep -qi "already exists" /tmp/r2-create.log; then
              echo "R2 bucket already existed."
            else
              echo "::error::Failed to ensure R2 bucket kiraku-staff-ops-data. See log above."
              exit 1
            fi
          fi

      # KVネームスペースの自動払い出しは現状スキップ（既存CLOUDFLARE_API_TOKENに
      # Workers KV Storage: Edit 権限が無いため）。wrangler.toml側でも
      # [[kv_namespaces]] をコメントアウト済み。有効化手順は
      # cloudflare/staff-ops/ACCESS_SETUP.md 参照。

      - name: Deploy Worker
        working-directory: cloudflare/staff-ops
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
